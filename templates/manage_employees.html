<!-- 📄 File: templates/manage_employees.html -->
{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Manage Employees</h3>
<table class="table table-striped">
    <thead><tr><th>Name</th><th>Department</th><th>Position</th><th>Status</th></tr></thead>
    <tbody>
        {% for emp in employees %}
        <tr>
        <td>{{ emp.full_name }}</td>
        <td>{{ emp.department }}</td>
        <td>{{ emp.position }}</td>
        <td>{{ emp.status }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
